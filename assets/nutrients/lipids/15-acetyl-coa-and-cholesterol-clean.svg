<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="471" viewBox="0 0 1060 471" role="img" aria-labelledby="title description">
  <title id="title">胆固醇的合成原料</title>
  <desc id="description">糖类、脂质与部分氨基酸代谢汇入乙酰辅酶 A，后者经多步反应参与胆固醇合成。</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 8 9" refX="7" refY="4.5" orient="auto">
  <path d="M0 0l8 4.5L0 9z" fill="#2d6957"/>
  </marker>
  </defs>
  <rect width="1060" height="471" rx="26" fill="#fbf9f3"/>
  <g fill="#222b26" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, system-ui, sans-serif">
  <text x="42" y="62" font-size="37" font-weight="700">从营养物质到胆固醇合成</text>
  <rect x="42" y="145" width="212" height="64" rx="12" fill="#ddeee5" stroke="none"/>
  <text x="148" y="187" font-size="31" font-weight="700" text-anchor="middle" fill="#2d6957">糖类</text>
  <rect x="42" y="234" width="212" height="64" rx="12" fill="#f0e7f2" stroke="none"/>
  <text x="148" y="276" font-size="31" font-weight="700" text-anchor="middle" fill="#745384">脂质</text>
  <rect x="42" y="323" width="212" height="64" rx="12" fill="#f3e8d8" stroke="none"/>
  <text x="148" y="365" font-size="31" font-weight="700" text-anchor="middle" fill="#8f643b">部分氨基酸</text>
  <path d="M262 177H291 Q322 177 350 215L383 260 M262 266H377 M262 355H291 Q322 355 350 317L383 274" fill="none" stroke="#2d6957" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="379" y1="266" x2="409" y2="266" stroke="#2d6957" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="425" y="211" width="244" height="110" rx="16" fill="#ddeee5" stroke="none"/>
  <text x="547" y="256" font-size="32" font-weight="700" text-anchor="middle" fill="#2d6957">乙酰辅酶 A</text>
  <text x="547" y="292" font-size="24" text-anchor="middle" fill="#2d6957">Acetyl-CoA</text>
  <line x1="684" y1="266" x2="781" y2="266" stroke="#2d6957" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="732" y="225" font-size="22" font-weight="700" text-anchor="middle" fill="#536059">多步合成</text>
  <rect x="794" y="211" width="224" height="110" rx="16" fill="#fffdf8" stroke="#d8ded4"/>
  <text x="906" y="280" font-size="37" font-weight="700" text-anchor="middle">胆固醇</text>
  <text x="42" y="440" font-size="24" fill="#536059">箭头概括代谢去向。乙酰辅酶 A 是胆固醇的合成原料之一。</text>
  </g>
</svg>
