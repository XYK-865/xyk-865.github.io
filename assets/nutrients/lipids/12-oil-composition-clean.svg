<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 388" width="960" height="388" role="img" aria-label="普通葵花籽油、棉籽油和动物油示例的脂肪酸百分比">
  <title>普通葵花籽油、棉籽油和动物油示例的脂肪酸百分比</title>
  <style>
    text{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#24302b}
    .heading{font-size:31px;font-weight:700}
    .muted{fill:#4f6157}
    .note{font-size:23px}
  </style>
  <rect width="100%" height="100%" fill="#f6f5ef"/>
  <rect x="36" y="36" width="888" height="69" rx="10" fill="#e9e9df"/>
  <rect x="467" y="36" width="145" height="69" fill="#d2e2d1"/>
  <text x="55" y="79" class="note" font-weight="700">油脂</text>
  <text x="394" y="79" class="note" text-anchor="middle" font-weight="700">饱和脂肪酸</text>
  <text x="540" y="79" class="note" text-anchor="middle" font-weight="700">ω-3</text>
  <text x="685" y="79" class="note" text-anchor="middle" font-weight="700">ω-6</text>
  <text x="830" y="79" class="note" text-anchor="middle" font-weight="700">ω-9</text>
  <rect x="36" y="105" width="888" height="64" fill="#fcfbf5"/>
  <rect x="467" y="105" width="145" height="64" fill="#e5ede5"/>
  <g transform="translate(54 113)"><rect x="5" y="8" width="32" height="39" rx="8" fill="#f2ca71" stroke="#766145"/><path d="M13 9V3h16v6" fill="#ad946f" stroke="#766145"/><circle cx="21" cy="27" r="7" fill="#fff3bc" stroke="#8a693c"/><circle cx="21" cy="27" r="2.5" fill="#8a693c"/></g>
  <text x="111" y="146" font-size="27" font-weight="700">普通葵花籽油</text>
  <text x="394" y="146" font-size="27" text-anchor="middle">10–12%</text>
  <text x="540" y="146" font-size="27" text-anchor="middle">≈0.2%</text>
  <text x="685" y="146" font-size="27" text-anchor="middle">≈60%</text>
  <text x="830" y="146" font-size="27" text-anchor="middle">≈20%</text>
  <rect x="36" y="170" width="888" height="64" fill="#f5f3ea"/>
  <rect x="467" y="170" width="145" height="64" fill="#e5ede5"/>
  <g transform="translate(54 178)"><rect x="5" y="8" width="32" height="39" rx="8" fill="#e9d7a7" stroke="#766145"/><path d="M13 9V3h16v6" fill="#ad946f" stroke="#766145"/><path d="m21 35-5-4m5 4 5-4" fill="none" stroke="#766145"/><path d="M13 29a5 5 0 0 1 5-5 4 4 0 0 1 7 0 5 5 0 1 1-4 8 5 5 0 0 1-8-3Z" fill="#fffaf0" stroke="#8a693c"/></g>
  <text x="111" y="211" font-size="27" font-weight="700">棉籽油</text>
  <text x="394" y="211" font-size="27" text-anchor="middle">25–27%</text>
  <text x="540" y="211" font-size="27" text-anchor="middle">≈0.5%</text>
  <text x="685" y="211" font-size="27" text-anchor="middle">≈54%</text>
  <text x="830" y="211" font-size="27" text-anchor="middle">≈19%</text>
  <rect x="36" y="235" width="888" height="64" fill="#fcfbf5"/>
  <rect x="467" y="235" width="145" height="64" fill="#e5ede5"/>
  <g transform="translate(54 243)"><path d="m1 36 32-6 10 6-32 9Z" fill="#b68d60" stroke="#776044"/><path d="M7 34q-4-9 6-13 0-5 8-6 5-5 9 1 11 0 10 11 5 7-6 10-16 4-27-3Z" fill="#fff1d9" stroke="#937653"/></g>
  <text x="111" y="276" font-size="27" font-weight="700">动物油示例*</text>
  <text x="394" y="276" font-size="27" text-anchor="middle">47–50%</text>
  <text x="540" y="276" font-size="27" text-anchor="middle">≈3%</text>
  <text x="685" y="276" font-size="27" text-anchor="middle">≈6%</text>
  <text x="830" y="276" font-size="27" text-anchor="middle">≈40%</text>
