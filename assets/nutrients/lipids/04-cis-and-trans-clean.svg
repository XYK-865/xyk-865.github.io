<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="454" viewBox="0 0 1060 454" role="img" aria-labelledby="title description">
  <title id="title">顺式与反式双键</title>
  <desc id="description">画出同侧氢的 cis 双键和相对侧氢的 trans 双键。</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 8 9" refX="7" refY="4.5" orient="auto">
  <path d="M0 0l8 4.5L0 9z" fill="#2d6957"/>
  </marker>
  </defs>
  <rect width="1060" height="454" rx="26" fill="#fbf9f3"/>
  <g fill="#222b26" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, system-ui, sans-serif">
  <text x="42" y="62" font-size="37" font-weight="700">顺式与反式双键的区别</text>
  <rect x="42" y="96" width="474" height="280" rx="21" fill="#f0e7f2" stroke="none"/>
  <text x="70" y="146" font-size="32" font-weight="700" fill="#745384">顺式 · cis</text>
  <line x1="252" y1="236" x2="306" y2="236" stroke="#745384" stroke-width="3" stroke-linecap="round" />
  <line x1="252" y1="246" x2="306" y2="246" stroke="#745384" stroke-width="3" stroke-linecap="round" />
  <text x="237" y="251" font-size="32" font-weight="700" text-anchor="middle">C</text>
  <text x="321" y="251" font-size="32" font-weight="700" text-anchor="middle">C</text>
  <line x1="220" y1="226" x2="179" y2="190" stroke="#745384" stroke-width="3" stroke-linecap="round" />
  <line x1="220" y1="256" x2="179" y2="292" stroke="#745384" stroke-width="3" stroke-linecap="round" />
  <text x="160" y="189" font-size="31" font-weight="700" text-anchor="middle" fill="#222b26">R₁</text>
  <text x="160" y="314" font-size="31" font-weight="700" text-anchor="middle" fill="#745384">H</text>
  <line x1="338" y1="226" x2="379" y2="190" stroke="#745384" stroke-width="3" stroke-linecap="round" />
  <line x1="338" y1="256" x2="379" y2="292" stroke="#745384" stroke-width="3" stroke-linecap="round" />
  <text x="398" y="189" font-size="31" font-weight="700" text-anchor="middle" fill="#222b26">R₂</text>
  <text x="398" y="314" font-size="31" font-weight="700" text-anchor="middle" fill="#745384">H</text>
  <text x="279" y="351" font-size="28" font-weight="700" text-anchor="middle" fill="#745384">两个氢在同侧</text>
  <rect x="544" y="96" width="474" height="280" rx="21" fill="#ddeee5" stroke="none"/>
  <text x="572" y="146" font-size="32" font-weight="700" fill="#2d6957">反式 · trans</text>
  <line x1="754" y1="236" x2="808" y2="236" stroke="#2d6957" stroke-width="3" stroke-linecap="round" />
  <line x1="754" y1="246" x2="808" y2="246" stroke="#2d6957" stroke-width="3" stroke-linecap="round" />
  <text x="739" y="251" font-size="32" font-weight="700" text-anchor="middle">C</text>
  <text x="823" y="251" font-size="32" font-weight="700" text-anchor="middle">C</text>
  <line x1="722" y1="226" x2="681" y2="190" stroke="#2d6957" stroke-width="3" stroke-linecap="round" />
  <line x1="722" y1="256" x2="681" y2="292" stroke="#2d6957" stroke-width="3" stroke-linecap="round" />
  <text x="662" y="189" font-size="31" font-weight="700" text-anchor="middle" fill="#222b26">R₁</text>
  <text x="662" y="314" font-size="31" font-weight="700" text-anchor="middle" fill="#2d6957">H</text>
  <line x1="840" y1="226" x2="881" y2="190" stroke="#2d6957" stroke-width="3" stroke-linecap="round" />
  <line x1="840" y1="256" x2="881" y2="292" stroke="#2d6957" stroke-width="3" stroke-linecap="round" />
  <text x="900" y="189" font-size="31" font-weight="700" text-anchor="middle" fill="#2d6957">H</text>
  <text x="900" y="314" font-size="31" font-weight="700" text-anchor="middle" fill="#222b26">R₂</text>
  <text x="781" y="351" font-size="28" font-weight="700" text-anchor="middle" fill="#2d6957">两个氢在相对侧</text>
  <text x="42" y="426" font-size="24" fill="#536059">R₁ 与 R₂ 表示双键两端其余的碳链。</text>
  </g>
</svg>
