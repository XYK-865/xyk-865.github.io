<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 478" width="960" height="478" role="img" aria-label="Omega-3 与 Omega-6 的代表成员及分工">
  <title>Omega-3 与 Omega-6 的代表成员及分工</title>
  <style>
    text{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#24302b}
    .heading{font-size:31px;font-weight:700}
    .muted{fill:#4f6157}
    .note{font-size:23px}
  </style>
  <rect width="100%" height="100%" fill="#f6f5ef"/>
  <text x="40" y="62" class="heading">Omega-3（ω-3）</text>
  <rect x="36" y="88" width="432" height="82" rx="12" fill="#e6eee7" stroke="#ccd9cd"/>
  <text x="53" y="119" font-size="23" font-weight="700">ALA · α-亚麻酸</text>
  <text x="453" y="119" font-size="20" class="muted" text-anchor="end">18:3 n-3</text>
  <text x="53" y="150" font-size="22">可转化为少量 EPA、DHA</text>
  <rect x="36" y="185" width="432" height="82" rx="12" fill="#e6eee7" stroke="#ccd9cd"/>
  <text x="53" y="216" font-size="23" font-weight="700">EPA · 二十碳五烯酸</text>
  <text x="453" y="216" font-size="20" class="muted" text-anchor="end">20:5 n-3</text>
  <text x="53" y="247" font-size="22">可作为脂质信号分子的原料</text>
  <rect x="36" y="282" width="432" height="82" rx="12" fill="#e6eee7" stroke="#ccd9cd"/>
  <text x="53" y="313" font-size="23" font-weight="700">DHA · 二十二碳六烯酸</text>
  <text x="453" y="313" font-size="20" class="muted" text-anchor="end">22:6 n-3</text>
  <text x="53" y="344" font-size="22">是脑和视网膜细胞膜的组分</text>
  <text x="496" y="62" class="heading">Omega-6（ω-6）</text>
  <rect x="492" y="88" width="432" height="82" rx="12" fill="#eee9f2" stroke="#d8cfe1"/>
  <text x="509" y="119" font-size="23" font-weight="700">LA · 亚油酸</text>
  <text x="909" y="119" font-size="20" class="muted" text-anchor="end">18:2 n-6</text>
  <text x="509" y="150" font-size="22">有助维持皮肤屏障，可转化为 AA</text>
  <rect x="492" y="185" width="432" height="82" rx="12" fill="#eee9f2" stroke="#d8cfe1"/>
  <text x="509" y="216" font-size="23" font-weight="700">AA · 花生四烯酸</text>
  <text x="909" y="216" font-size="20" class="muted" text-anchor="end">20:4 n-6</text>
  <text x="509" y="247" font-size="22">是细胞膜成分，参与脂质信号</text>
  <rect x="36" y="386" width="888" height="58" rx="10" fill="#e5ebe4"/>
  <text x="55" y="424" font-size="24" font-weight="700">ALA 和 LA 是必需脂肪酸，两者都要从食物中获得。</text>
</svg>
