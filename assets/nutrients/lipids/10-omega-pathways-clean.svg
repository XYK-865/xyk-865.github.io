<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="556" viewBox="0 0 1060 556" role="img" aria-labelledby="title description">
  <title id="title">Omega-6 与 Omega-3 的转化路径</title>
  <desc id="description">n−6：LA 经 GLA、DGLA、AA，多步转化可形成 n−6 DPA；n−3：ALA 经 SDA、ETA、EPA，再经多步形成 DHA。两条路径共享部分去饱和酶。</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 8 9" refX="7" refY="4.5" orient="auto">
  <path d="M0 0l8 4.5L0 9z" fill="#2d6957"/>
  </marker>
  </defs>
  <rect width="1060" height="556" rx="26" fill="#fbf9f3"/>
  <g fill="#222b26" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, system-ui, sans-serif">
  <text x="42" y="62" font-size="37" font-weight="700">Omega-6 与 Omega-3 的转化路径</text>
  <text x="42" y="138" font-size="28" font-weight="700" fill="#745384">Omega-6</text>
  <rect x="42" y="160" width="176" height="86" rx="12" fill="#f0e7f2" stroke="none"/>
  <text x="130" y="197" font-size="34" font-weight="700" text-anchor="middle" fill="#745384">LA</text>
  <text x="130" y="232" font-size="22" text-anchor="middle">亚油酸</text>
  <line x1="224" y1="201" x2="236" y2="201" stroke="#2d6957" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="242" y="160" width="176" height="86" rx="12" fill="#f0e7f2" stroke="none"/>
  <text x="330" y="197" font-size="34" font-weight="700" text-anchor="middle" fill="#745384">GLA</text>
  <text x="330" y="232" font-size="22" text-anchor="middle">γ-亚麻酸</text>
  <line x1="424" y1="201" x2="436" y2="201" stroke="#2d6957" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="442" y="160" width="176" height="86" rx="12" fill="#f0e7f2" stroke="none"/>
  <text x="530" y="197" font-size="34" font-weight="700" text-anchor="middle" fill="#745384">DGLA</text>
  <text x="530" y="232" font-size="22" text-anchor="middle">二高-γ-亚麻酸</text>
  <line x1="624" y1="201" x2="636" y2="201" stroke="#2d6957" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="642" y="160" width="176" height="86" rx="12" fill="#f0e7f2" stroke="none"/>
  <text x="730" y="197" font-size="34" font-weight="700" text-anchor="middle" fill="#745384">AA</text>
  <text x="730" y="232" font-size="22" text-anchor="middle">花生四烯酸</text>
  <line x1="824" y1="201" x2="836" y2="201" stroke="#2d6957" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="842" y="160" width="176" height="86" rx="12" fill="#f0e7f2" stroke="none"/>
  <text x="930" y="197" font-size="34" font-weight="700" text-anchor="middle" fill="#745384">DPA</text>
  <text x="930" y="232" font-size="22" text-anchor="middle">22:5 n−6</text>
  <text x="230" y="279" font-size="23" text-anchor="middle" fill="#536059">Δ6 去饱和</text>
  <text x="430" y="279" font-size="23" text-anchor="middle" fill="#536059">延长碳链</text>
  <text x="630" y="279" font-size="23" text-anchor="middle" fill="#536059">Δ5 去饱和</text>
  <text x="830" y="279" font-size="23" text-anchor="middle" fill="#536059">后续多步</text>
  <text x="42" y="326" font-size="28" font-weight="700" fill="#2d6957">Omega-3</text>
  <rect x="42" y="348" width="176" height="86" rx="12" fill="#ddeee5" stroke="none"/>
  <text x="130" y="385" font-size="34" font-weight="700" text-anchor="middle" fill="#2d6957">ALA</text>
  <text x="130" y="420" font-size="22" text-anchor="middle">α-亚麻酸</text>
  <line x1="224" y1="389" x2="236" y2="389" stroke="#2d6957" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="242" y="348" width="176" height="86" rx="12" fill="#ddeee5" stroke="none"/>
  <text x="330" y="385" font-size="34" font-weight="700" text-anchor="middle" fill="#2d6957">SDA</text>
  <text x="330" y="420" font-size="22" text-anchor="middle">十八碳四烯酸</text>
  <line x1="424" y1="389" x2="436" y2="389" stroke="#2d6957" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="442" y="348" width="176" height="86" rx="12" fill="#ddeee5" stroke="none"/>
  <text x="530" y="385" font-size="34" font-weight="700" text-anchor="middle" fill="#2d6957">ETA</text>
  <text x="530" y="420" font-size="22" text-anchor="middle">二十碳四烯酸</text>
  <line x1="624" y1="389" x2="636" y2="389" stroke="#2d6957" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="642" y="348" width="176" height="86" rx="12" fill="#ddeee5" stroke="none"/>
  <text x="730" y="385" font-size="34" font-weight="700" text-anchor="middle" fill="#2d6957">EPA</text>
  <text x="730" y="420" font-size="22" text-anchor="middle">二十碳五烯酸</text>
  <line x1="824" y1="389" x2="836" y2="389" stroke="#2d6957" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="842" y="348" width="176" height="86" rx="12" fill="#ddeee5" stroke="none"/>
  <text x="930" y="385" font-size="34" font-weight="700" text-anchor="middle" fill="#2d6957">DHA</text>
  <text x="930" y="420" font-size="22" text-anchor="middle">二十二碳六烯酸</text>
  <text x="230" y="467" font-size="23" text-anchor="middle" fill="#536059">Δ6 去饱和</text>
  <text x="430" y="467" font-size="23" text-anchor="middle" fill="#536059">延长碳链</text>
  <text x="630" y="467" font-size="23" text-anchor="middle" fill="#536059">Δ5 去饱和</text>
  <text x="830" y="467" font-size="23" text-anchor="middle" fill="#536059">后续多步</text>
  <text x="42" y="525" font-size="24" fill="#536059">两条路径共享部分酶，但产物各自留在原来的 Omega 家族。</text>
  </g>
</svg>
