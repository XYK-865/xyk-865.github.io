<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>个人书架 · Spike Hsu</title>
  <meta name="description" content="上传自己的 PDF、EPUB 和阅读资料，按目录阅读，保留高亮、批注与阅读进度。">
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=cat-smooth-parity-20261028">
  <link rel="stylesheet" href="fitness-reading.css">
  <link rel="stylesheet" href="assets/personal-os/bookshelf-project.css?v=local-bookshelf-20261101">
  <link rel="stylesheet" href="private-shelf.css?v=local-dating-20261101">
  <link rel="stylesheet" href="bookshelf-photo.css?v=20261102-wide-default">
</head>
<body class="personal-bookshelf-page bookshelf-page" data-reader-return="bookshelf">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header id="site-header" data-page="projects"></header>
  <main id="main" class="page-shell personal-bookshelf-main">
    <nav class="personal-shelf-breadcrumb" aria-label="当前位置"><a href="projects.html">项目与作品</a><span>/</span><span>个人书架</span></nav>
    <header class="personal-shelf-hero personal-shelf-hero--photo shelf-layout-wide">
      <img class="personal-shelf-background" src="assets/books/snow-reading-landscape-v2.webp" alt="" fetchpriority="high">
      <div class="personal-shelf-heading">
        <p class="kicker">PERSONAL LIBRARY / READING ROOM</p>
        <h1>个人书架</h1>
        <p class="personal-shelf-subtitle">一本书，一个可以反复回来的地方。</p>
        <p class="personal-shelf-description">把上传的 PDF、电子书与阅读资料整理在一起，沿着目录阅读，也留下自己的高亮与批注。</p>
        <div class="personal-shelf-meta"><span id="shelf-count">正在整理资料…</span><span>阅读 · 思考 · 留下笔记</span></div>
        <a class="personal-shelf-hero-link" href="#shelf-library">进入书架 <span aria-hidden="true">↓</span></a>
      </div>
    </header>

    <section id="shelf-library" class="shelf-section personal-shelf-library" aria-labelledby="shelf-library-title">
      <div class="personal-shelf-section-heading"><div><p class="kicker">ON THE SHELF</p><h2 id="shelf-library-title">我的阅读资料</h2></div><p>从一本书开始，慢慢留下自己的理解。</p></div>
      <div class="shelf-category-switch" role="group" aria-label="书架分类"><button type="button" data-shelf-category="general" aria-pressed="true">全部资料</button><button type="button" data-shelf-category="training" aria-pressed="false">运动</button><button type="button" data-shelf-category="health" aria-pressed="false">健康</button><button type="button" data-shelf-category="nutrition" aria-pressed="false">饮食</button><button type="button" data-shelf-category="dating" aria-pressed="false">约会</button></div>
      <div id="general-shelf-view">
      <div class="bookshelf-toolbar">
        <div class="shelf-filters" aria-label="资料类型">
          <button type="button" data-filter="全部" aria-pressed="true">全部</button>
          <button type="button" data-filter="书籍" aria-pressed="false">书籍</button>
          <button type="button" data-filter="PDF" aria-pressed="false">PDF</button>
          <button type="button" data-filter="EPUB" aria-pressed="false">EPUB</button>
          <button type="button" data-filter="文章" aria-pressed="false">文章</button>
          <button type="button" data-filter="论文" aria-pressed="false">论文</button>
        </div>
        <div class="shelf-tools">
          <input id="shelf-search" type="search" aria-label="搜索书架" placeholder="搜索书名、作者或资料">
          <select id="shelf-sort" aria-label="书架排序"><option value="recent">最近阅读</option><option value="title">按名称</option></select>
          <label class="shelf-import">＋ 导入资料<input id="import-reading" type="file" accept=".pdf,.epub,.txt,.md,application/pdf,application/epub+zip,text/plain,text/markdown" multiple></label>
        </div>
      </div>
      <p class="shelf-local-note">支持 PDF、EPUB、TXT 和 Markdown。导入的文件、阅读进度和批注保存在当前浏览器。</p>
      <p id="library-status" role="status" aria-live="polite"></p>
      <div id="bookshelf" class="bookshelf-grid"><p class="shelf-empty">正在整理书架…</p></div>
      </div>
      <div id="dating-shelf-view" hidden></div>
    </section>
    <footer class="personal-shelf-footer"><a href="projects.html">← 返回项目与作品</a><a href="#main">返回顶部 ↑</a></footer>
  </main>
  <footer id="site-footer"></footer>
  <script src="posts.js"></script>
  <script src="bookshelf-layout-preview.js?v=20261102-wide-default"></script>
  <script src="app.js?v=cat-smooth-parity-20261028"></script>
  <script type="module" src="fitness-library.js?v=personal-bookshelf-20261101"></script>
  <script type="module" src="dating-shelf.js?v=local-dating-20261101"></script>
</body>
</html>
