  </marker>
  </defs>
  <rect width="1060" height="493" rx="26" fill="#fbf9f3"/>
  <g fill="#222b26" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, system-ui, sans-serif">
  <text x="42" y="62" font-size="37" font-weight="700">双低菜籽油 · Canola</text>
  <rect x="42" y="95" width="286" height="366" rx="21" fill="#ddeee5" stroke="none"/>
  <path d="M148 148h72v53l47 39v139c0 21-12 32-32 32H135c-20 0-32-11-32-32V240l45-39Z" fill="#f3e8d8" stroke="#8f643b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M104 260c41-17 112 18 162 3v116c0 17-10 29-29 29H133c-18 0-29-10-29-29Z" fill="#e3bd68"/>
