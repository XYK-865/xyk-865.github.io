  <rect x="352" y="95" width="666" height="366" rx="21" fill="#fffdf8" stroke="#d8ded4"/>
  <text x="384" y="156" font-size="30" font-weight="700" fill="#2d6957">Omega-6 : Omega-3</text>
  <text x="384" y="248" font-size="64" font-weight="700" fill="#2d6957">约 2 : 1</text>
