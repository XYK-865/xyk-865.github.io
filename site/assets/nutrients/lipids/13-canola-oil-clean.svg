<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="493" viewBox="0 0 1060 493" role="img" aria-labelledby="title description">
  <title id="title">双低菜籽油脂肪酸示例</title>
  <desc id="description">典型 Omega-6 与 Omega-3 约 2:1；油酸为主，并含亚油酸与α-亚麻酸。产品组成和反式脂肪含量可有差异。</desc>
