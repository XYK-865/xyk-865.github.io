<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="423" viewBox="0 0 1060 423" role="img" aria-labelledby="title description">
  <title id="title">ALA 转化为 EPA 和 DHA 的示例</title>
  <desc id="description">视频图示给出 ALA 转化为 EPA 的比例为 10–20%，转化为 DHA 为 0–10%。仅为示意范围。</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 8 9" refX="7" refY="4.5" orient="auto">
  <path d="M0 0l8 4.5L0 9z" fill="#2d6957"/>
  </marker>
  </defs>
  <rect width="1060" height="423" rx="26" fill="#fbf9f3"/>
  <g fill="#222b26" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, system-ui, sans-serif">
  <text x="42" y="62" font-size="37" font-weight="700">α-亚麻酸的转化比例示意</text>
  <rect x="42" y="157" width="235" height="139" rx="21" fill="#ddeee5" stroke="none"/>
  <text x="159" y="220" font-size="44" font-weight="700" text-anchor="middle" fill="#2d6957">ALA</text>
  <text x="159" y="267" font-size="28" text-anchor="middle">α-亚麻酸</text>
  <path d="M288 226H436 M436 226 C486 226 477 167 534 167 M436 226 C486 226 477 285 534 285" fill="none" stroke="#2d6957" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="534" y1="167" x2="577" y2="167" stroke="#2d6957" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="534" y1="285" x2="577" y2="285" stroke="#2d6957" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="391" y="202" font-size="26" font-weight="700" text-anchor="middle" fill="#2d6957">多步酶促反应</text>
  <rect x="592" y="110" width="426" height="105" rx="21" fill="#f0e7f2" stroke="none"/>
  <text x="628" y="177" font-size="36" font-weight="700" fill="#745384">EPA</text>
  <text x="988" y="177" font-size="42" font-weight="700" text-anchor="end" fill="#745384">10–20%</text>
  <rect x="592" y="233" width="426" height="105" rx="21" fill="#fffdf8" stroke="#d8ded4"/>
  <text x="628" y="299" font-size="36" font-weight="700" fill="#2d6957">DHA</text>
  <text x="988" y="299" font-size="42" font-weight="700" text-anchor="end" fill="#2d6957">0–10%</text>
  <text x="42" y="392" font-size="24" fill="#536059">比例沿用视频示例。实际转化受个体、膳食和测量方法等影响。</text>
  </g>
</svg>
