<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>阅读器 · Spike Hsu</title><link rel="icon" href="favicon.svg?v=2" type="image/svg+xml"><link rel="stylesheet" href="styles.css?v=cat-smooth-parity-20261028"><link rel="stylesheet" href="assets/vendor/pdfjs/pdf_viewer.css"><link rel="stylesheet" href="fitness-reading.css"><link rel="stylesheet" href="reading-language.css"></head>
<body class="reader-body"><div class="reader-app"><header class="reader-top"><a href="fitness-books.html">← 返回书架</a><h1 id="reader-title">正在打开资料</h1><span class="reader-local-label">本地阅读</span></header>
<div class="reader-toolbar"><button type="button" id="outline-toggle" aria-controls="reader-outline" aria-expanded="true">目录</button><div id="pdf-controls" hidden><button id="previous-page" type="button" aria-label="上一页">←</button><label>第 <input id="page-number" type="number" min="1" value="1" aria-label="PDF 页码"> / <span id="page-count">1</span> 页</label><button id="next-page" type="button" aria-label="下一页">→</button><select id="pdf-zoom" aria-label="PDF 缩放"><option value="1">适合宽度</option><option value="1.25">125%</option><option value="1.5">150%</option></select></div><button type="button" id="area-highlight" aria-pressed="false" hidden>荧光笔</button><span id="brush-options" hidden><select id="mark-tool" aria-label="高亮方式"><option value="brush">刷子</option><option value="rectangle">矩形</option></select><label class="brush-width">笔宽 <input id="brush-size" type="range" min="6" max="36" step="2" value="16" aria-label="荧光笔笔宽"></label></span><span class="reader-spacer"></span><select id="highlight-color" aria-label="高亮颜色"><option value="yellow">黄色</option><option value="green">绿色</option><option value="pink">粉色</option></select><button type="button" id="add-highlight">高亮选中内容</button><button type="button" id="add-note">添加批注</button><button type="button" id="notes-toggle" aria-controls="reader-notes" aria-expanded="true">批注 <span id="annotation-count">0</span></button></div>
<div class="reader-languagebar"><button type="button" id="simplified-toggle" aria-pressed="false">简体</button><button type="button" id="translate-selection">译为中文</button><button type="button" id="open-translation-settings">翻译设置</button><small id="reader-translation-mode">按需翻译选中的段落 · 可接入自己的 API</small></div>
<div class="reader-layout"><aside id="reader-outline" class="reader-sidebar"><h2>大纲</h2><nav id="outline-list" aria-label="阅读目录"></nav></aside><section class="reader-stage" id="reader-stage" aria-label="阅读正文"><div id="reader-content" class="reader-content"><p>正在加载…</p></div></section><aside id="reader-notes" class="reader-sidebar reader-notes"><div class="reader-notes-title"><h2>高亮与批注</h2><button type="button" id="export-notes">导出笔记</button></div><p class="reader-storage-note">保存在当前浏览器，与原文件分开。清除浏览器数据前请导出备份。</p><div id="annotation-list"></div></aside></div>
<p id="reader-status" class="reader-status" role="status" aria-live="polite">正在加载资料…</p>
<dialog id="note-dialog"><form method="dialog"><h2 id="note-dialog-title">添加批注</h2><blockquote id="note-quote"></blockquote><label for="note-text">我的批注</label><textarea id="note-text" rows="5" maxlength="10000"></textarea><div class="note-dialog-actions"><button value="cancel" type="submit">取消</button><button id="save-note" type="button">保存批注</button></div></form></dialog></div><dialog id="translation-settings-dialog" class="language-dialog"><form method="dialog"><h2>翻译 API 设置</h2><p id="translation-settings-intro">按平台分别配置。密钥由本地服务保管；翻译只发送你选中的段落，会使用该平台的 API 额度。</p><label>平台<select id="translation-provider"><option value="deepseek">DeepSeek</option><option value="zhipu">智谱</option><option value="kimi">Kimi</option><option value="custom">自定义兼容接口</option></select></label><label>完整接口地址<input id="translation-endpoint" type="url" spellcheck="false" placeholder="https://…/chat/completions"></label><label>模型名称<input id="translation-model" type="text" spellcheck="false" placeholder="按平台填写模型名称"></label><label>API Key<input id="translation-key" type="password" autocomplete="new-password" spellcheck="false"></label><label class="translation-remember"><input id="translation-remember" type="checkbox">记住到本机（本地私有配置，不进入网站发布目录）</label><p><a id="translation-provider-docs" target="_blank" rel="noopener noreferrer" hidden>查看该平台官方文档 ↗</a></p><p id="translation-config-status" role="status">正在读取本地配置…</p><div class="language-dialog-actions"><button id="clear-translation-key" type="button">清除该平台密钥</button><button type="submit">关闭</button><button id="save-translation-settings" type="button">保存配置</button></div></form></dialog>
<dialog id="translation-result-dialog" class="language-dialog translation-result"><form method="dialog"><div class="language-result-heading"><h2 id="translation-result-title">中文译读</h2><button type="submit" aria-label="关闭译读">关闭</button></div><div class="translation-columns"><section><h3>原文 / 说明</h3><p id="translation-source"></p></section><section><h3>简体中文</h3><p id="translation-output" translate="no"></p></section></div><p id="translation-status" role="status"></p></form></dialog><script src="assets/vendor/opencc/full.js"></script><script type="module" src="fitness-reader.js"></script></body></html>
