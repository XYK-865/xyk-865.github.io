    <section id="coffee-records" class="coffee-records" aria-labelledby="coffee-records-title">
      <header class="coffee-section-heading"><div><p class="kicker">MY CUPS</p><h2 id="coffee-records-title">我的咖啡记录</h2></div><p id="coffee-count" aria-live="polite">0 杯记录</p></header>
      <details class="coffee-editor" id="coffee-editor"><summary>＋ 记下一杯</summary>
        <p class="coffee-storage-note">记录仅保存在当前浏览器，不会自动上传网站。换设备或清理浏览器前，可以导出备份。</p>
        <form id="coffee-form">
          <div class="coffee-form-grid"><label>日期<input name="date" type="date" required></label><label>咖啡 / 豆子名称<input name="name" maxlength="100" placeholder="这杯咖啡叫什么" required></label><label>产地 / 庄园<input name="origin" maxlength="120" placeholder="知道多少就记多少"></label><label>烘焙程度<select name="roast"><option value="">未记录</option><option>浅烘</option><option>中浅烘</option><option>中烘</option><option>中深烘</option><option>深烘</option></select></label><label>冲煮方式<select name="method"><option value="">未记录</option><option>手冲</option><option>意式浓缩</option><option>美式</option><option>拿铁</option><option>卡布奇诺</option><option>馥芮白</option><option>摩卡咖啡</option><option>法压</option><option>摩卡壶</option><option>冷萃</option><option>其他</option></select></label><div class="coffee-ratio-inputs"><label>咖啡粉 / g<input name="dose" type="number" min="0.1" max="1000" step="0.1" placeholder="可不填"></label><label>注水量 / g<input name="water" type="number" min="1" max="10000" step="1" placeholder="可不填"></label></div></div>
          <label>关联豆子百科（可选）<select id="coffee-bean" name="beanId"><option value="">暂不关联</option></select></label><label>风味与感受<textarea name="notes" maxlength="3000" rows="3" placeholder="香气、酸甜、口感，或者下次想调整的地方。"></textarea></label>
          <div class="coffee-editor-actions"><button type="submit">保存到本机</button><p id="coffee-status" role="status" aria-live="polite"></p></div>
        </form>
      </details>
      <div class="coffee-record-list" id="coffee-record-list"></div>
      <button id="coffee-export" type="button" hidden>导出咖啡记录</button>
